<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Obelisk Activity Monitoring</title>
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      try {
        if (localStorage.getItem('obelisk-dark') === '1') {
          document.documentElement.classList.add('app-dark');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="login-page" data-page="login">
  <div class="login-screen">
    <div class="login-bg" aria-hidden="true"></div>

    <div class="login-panel">
      <div class="login-card">
        <div class="login-card-header">
          <div class="login-logo" aria-hidden="true">O</div>
          <h2>Welcome to <span class="text-primary">Obelisk</span></h2>
          <p>Smart Delivery with Integrated Systems</p>
        </div>

        <form id="loginForm" class="login-form" novalidate>
          <div class="form-group">
            <label for="username">Username</label>
            <div class="input-with-icon">
              <i class="pi pi-user input-icon"></i>
              <input
                type="text"
                id="username"
                name="username"
                class="form-control"
                placeholder="Enter your username"
                autocomplete="username"
                required
              >
            </div>
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <div class="input-with-icon">
              <i class="pi pi-lock input-icon"></i>
              <input
                type="password"
                id="password"
                name="password"
                class="form-control"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              >
              <button type="button" class="password-toggle" id="passwordToggle" title="Show password" aria-label="Toggle password visibility">
                <i class="pi pi-eye"></i>
              </button>
            </div>
          </div>

          <div class="login-form-options">
            <label class="checkbox-label">
              <input type="checkbox" id="rememberMe" name="rememberMe">
              <span>Remember me</span>
            </label>
            <a href="#" class="login-forgot-link" onclick="alert('Contact your system administrator to reset your password.'); return false;">Forgot password?</a>
          </div>

          <div class="login-error hidden" id="loginError" role="alert"></div>

          <button type="submit" class="btn btn-primary btn-login" id="loginBtn">
            <i class="pi pi-sign-in"></i> Sign In
          </button>
        </form>

        <div class="login-demo-hint">
          <span class="badge badge-idle">Demo Access</span>
          <p>Username: <strong>admin</strong> &nbsp;·&nbsp; Password: <strong>admin123</strong></p>
        </div>
      </div>
    </div>

    <p class="login-copyright">© 2026 Obelisk Tech Ltd. All rights reserved.</p>
  </div>

  <script src="js/tracking-service.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
